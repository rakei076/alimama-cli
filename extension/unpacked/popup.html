<!doctype html><meta charset="utf-8">
<style>body{margin:0;padding:12px 14px;width:300px;font:13px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
h1{font-size:14px;margin:0 0 6px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:#aaa}
.on{background:#0f9960}
.acc{border-top:1px solid #eee;margin-top:8px;padding-top:6px}.acc h2{font-size:13px;margin:0 0 2px}
.row{display:flex;align-items:center;gap:6px;margin:3px 0}.row .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row small{color:#777}.row small.bad{color:#c23030;flex:none;max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cur{color:#0f9960;font-weight:600}.st{flex:none;width:9px;height:9px;border-radius:50%;background:#ccc}.st.on{background:#0f9960}.st.off{background:#d93025}.bad{color:#c23030}button{font:12px inherit;padding:1px 8px;cursor:pointer}
input[type=text]{flex:1;min-width:0;font:12px inherit;padding:2px 4px}#msg{color:#c23030;font-size:12px;min-height:1em}</style>
<h1>taobao-cli 取数桥</h1>
<div id="s"><span class="dot"></span>正在检查…</div>
<div id="accounts"></div>
<div id="msg"></div>
